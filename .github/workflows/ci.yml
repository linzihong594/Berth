name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test-and-build:
    name: Test and build (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-26, macos-15-intel]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain
        run: swift --version
      - name: Test core with temporary fixtures
        run: ./scripts/test.sh
      - name: Build and verify app
        run: ./scripts/build-app.sh
      - name: Archive app
        run: ditto -c -k --sequesterRsrc --keepParent dist/Berth.app dist/Berth-ci.zip
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Berth-${{ matrix.runner }}
          path: dist/Berth-ci.zip
          retention-days: 7
